name: Presentation screenshots (verification only)
on:
  push:
    branches: [apk/shots]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      ANDROID_USER_HOME: ${{ github.workspace }}/../android-user
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: gradle}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android SDK
        run: |
          mkdir -p "$ANDROID_USER_HOME"
          printf 'y\n%.0s' {1..100} | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools' >/dev/null
      - name: Build app and test APKs
        working-directory: fashion_app
        run: |
          for attempt in 1 2 3 4; do bash gradlew --version --console=plain >/dev/null && break; sleep $((attempt * 20)); done
          bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain --max-workers=2 2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E "^e: |FAIL|BUILD" || true
          grep -E "^e: " "$RUNNER_TEMP/build.log" | head -20 | sed 's/^/::error::/' || true
          grep -q "BUILD SUCCESSFUL" "$RUNNER_TEMP/build.log"
      - name: Run on emulator and capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: fashion_app
          script: bash ../.github/scripts/presentation-shots.sh
      - name: Convert to JPG and publish to branch apk/shots-output
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -q pillow
          python3 - <<'PY'
          import glob, os
          from PIL import Image
          for p in glob.glob("shots/*.png"):
              Image.open(p).convert("RGB").save(p[:-4] + ".jpg", quality=93)
          PY
          grep -E "FAILURES|OK \(|Error|AssertionError|stage " shots/instrument.txt | head -20 | sed 's/^/::notice::/' || true
          mkdir -p "$RUNNER_TEMP/out" && cp shots/* "$RUNNER_TEMP/out/" && cd "$RUNNER_TEMP/out"
          git init -q && git checkout -q -b out && git add -A
          git -c user.name=ci -c user.email=ci@example.invalid commit -qm "presentation shots ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" out:refs/heads/apk/shots-output
