name: Android debug APK

# 이지민의 body-analysis-debug-apk.yml 을 이 저장소 구조(fashion_app/ 이 최상위)에 맞게 옮긴 것.
# fashion_app 이 바뀐 커밋을 올리면 단위 테스트 → 디버그 APK 빌드 → Lint 를 돌리고,
# 폰에 설치할 수 있는 APK 를 Actions 실행 화면의 Artifacts 에 올려 준다. (API 키는 넣지 않음)
on:
  push:
    branches:
      - main
      - 'merge/**'
      - 'feature/**'
      - 'codex/**'
    paths:
      - .github/workflows/android-debug-apk.yml
      - fashion_app/**
      - backend/**
      - tools/**
  pull_request:
    paths:
      - .github/workflows/android-debug-apk.yml
      - fashion_app/**
      - backend/**
      - tools/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Never publish an update APK when a backend regression or startup matrix has failed.
    needs: [backend, server-start]
    # Serialize distribution checks/uploads across branches to reject stale builds.
    concurrency:
      group: fashionai-apk-distribution
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_USER_HOME: ${{ github.workspace }}/../android-user
    defaults:
      run:
        shell: bash
        working-directory: fashion_app
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            fashion_app/**/*.gradle.kts
            fashion_app/gradle.properties
            fashion_app/gradle/libs.versions.toml
            fashion_app/gradle/wrapper/gradle-wrapper.properties

      - name: Install Android SDK packages
        run: |
          mkdir -p "$ANDROID_USER_HOME"
          printf 'y\n%.0s' {1..100} | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'

      - name: Allocate and guard distribution version
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/apk_release.py prepare

      - name: Restore explicitly managed signing key (never cache or regenerate a distribution key)
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo '::warning::Distribution signing is not configured. Tests will run; APK publication will be blocked.'
            exit 0
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/fashionai-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fashionai-signing/debug.keystore"
          echo "ANDROID_DISTRIBUTION_KEYSTORE=$RUNNER_TEMP/fashionai-signing/debug.keystore" >> "$GITHUB_ENV"

      - name: Export signing passwords to Gradle only
        if: github.event_name != 'pull_request'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$ANDROID_DISTRIBUTION_KEYSTORE" ]; then
            [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ] || { echo '::error::Signing passwords missing'; exit 1; }
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${KEY_ALIAS:-androiddebugkey}" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        run: set -o pipefail; bash gradlew :app:assembleDebug --init-script gradle/test-runtime.init.gradle.kts --console=plain --max-workers=2 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Unit tests
        run: set -o pipefail; bash gradlew :app:testDebugUnitTest --init-script gradle/test-runtime.init.gradle.kts --console=plain --max-workers=2 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Compile instrumented tests
        run: set -o pipefail; bash gradlew :app:compileDebugAndroidTestKotlin --init-script gradle/test-runtime.init.gradle.kts --console=plain --max-workers=2 2>&1 | tee "$RUNNER_TEMP/androidtest.log"

      - name: Show errors as annotations (로그인 없이 볼 수 있게)
        if: failure()
        run: |
          cat "$RUNNER_TEMP"/*.log 2>/dev/null \
            | grep -E '^e: |error:|FAILED|What went wrong|Exception|expected:|> Task .*FAILED|tests completed' \
            | grep -v '^\s*at ' | head -80 > "$RUNNER_TEMP/errors.txt" || true
          msg=$(sed -e 's/%/%25/g' -e 's#file://'"$GITHUB_WORKSPACE"'/##' "$RUNNER_TEMP/errors.txt" | awk '{printf "%s%%0A", $0}')
          echo "::error title=Gradle errors::${msg}"
          { echo '### Gradle errors'; echo '```'; cat "$RUNNER_TEMP/errors.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Lint
        run: bash gradlew :app:lintDebug --init-script gradle/test-runtime.init.gradle.kts --console=plain --max-workers=2

      - name: Verify APK metadata and packaged features (validation only)
        working-directory: .
        run: python tools/apk_release.py verify fashion_app/app/build/outputs/apk/debug/app-debug.apk fashion_app/build/validation-apk

      - name: Preserve complete primary regression results before Preview replaces test outputs
        run: |
          cp -R app/build/test-results/testDebugUnitTest build/primary-test-results
          cp -R app/build/reports/tests/testDebugUnitTest build/primary-test-reports

      - name: Build isolated Preview and test isolation, sample photos and body entry
        run: |
          # Keep the complete primary regression above. Also exercise package-dependent
          # sample resources, data preservation and Compose entry flows in the distributed app.
          bash gradlew :app:assembleDebug :app:testDebugUnitTest -PfashionPreview=true \
            --tests '*PreviewIsolationTest' --tests '*AppBuildInfoTest' \
            --tests '*SampleWardrobePreviewTest' --tests '*WardrobeSampleRestoreUiTest' \
            --tests '*BackupAndRecommendationLogTest' --tests '*BodyMethodSelectionUiTest' \
            --tests '*BodyPhotoEntryUiTest' --tests '*BodyAnalysisResultUiTest' \
            --tests '*BodyAvatarTest' --tests '*HomeWeatherUiTest' \
            --tests '*AvatarProfileTest' --tests '*AvatarFittingTest' \
            --tests '*PresentationFittingUiTest' --tests '*LocalVton*' --tests '*OfficialDemoTest' --tests '*P7*' \
            --tests '*MeasuredSize*' --tests '*SilhouetteMeasurerTest' --tests '*P9*' --tests '*P10*' --tests '*P12*' \
            --init-script gradle/test-runtime.init.gradle.kts --console=plain --max-workers=2

      - name: Build Preview instrumentation harness (no device or live service execution)
        run: bash gradlew :app:assembleDebugAndroidTest -PfashionPreview=true --init-script gradle/test-runtime.init.gradle.kts --console=plain --max-workers=2

      - name: Render synthetic P9 and P10 mesh comparisons (CPU only)
        working-directory: .
        run: |
          python -m pip install --disable-pip-version-check numpy==2.4.6 Pillow==13.0.0
          python tools/render_p10_review.py fashion_app/app/build/p10-visual

      - name: Record distribution readiness
        id: distribution
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_CERTIFICATE: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          if [ -n "$ANDROID_DISTRIBUTION_KEYSTORE" ] && [ -n "$EXPECTED_CERTIFICATE" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::warning::APK publication blocked: original signing keystore and trusted certificate must be configured. Tests passing does NOT mean an installable update was published.'
            echo 'APK publication BLOCKED: original signing key / certificate configuration missing. No update APK is published.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify Preview trusted signer and monotonic version before publishing
        if: steps.distribution.outputs.ready == 'true'
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APK_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          python tools/apk_release.py verify fashion_app/app/build/outputs/apk/debug/app-debug.apk apk-artifact --distribution --preview

      - name: Upload APK
        if: success() && steps.distribution.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fashionai-preview-apk-vc${{ env.FASHION_VERSION_CODE }}-${{ github.sha }}
          path: apk-artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload opt-in Preview instrumentation harness
        if: success() && steps.distribution.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fashionai-preview-instrumentation-vc${{ env.FASHION_VERSION_CODE }}-${{ github.sha }}
          path: fashion_app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload validation metadata (contains no APK or signing key)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-info-vc${{ env.FASHION_VERSION_CODE }}-${{ github.sha }}
          path: |
            fashion_app/build/validation-apk/BUILD_INFO.txt
            fashion_app/build/validation-apk/BUILD_INFO.json
            fashion_app/build/validation-apk/SHA256SUMS.txt
            apk-artifact/BUILD_INFO.txt
            apk-artifact/BUILD_INFO.json
            apk-artifact/SHA256SUMS.txt
          if-no-files-found: error

      - name: Remove temporary signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/fashionai-signing/debug.keystore"

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-and-lint-reports
          path: |
            fashion_app/build/primary-test-results/
            fashion_app/build/primary-test-reports/
            fashion_app/app/build/test-results/testDebugUnitTest/
            fashion_app/app/build/reports/tests/
            fashion_app/app/build/reports/lint-results-debug.*
            fashion_app/app/build/p9-visual/
            fashion_app/app/build/p10-visual/
          if-no-files-found: warn
          retention-days: 30

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fashionai_test
          POSTGRES_USER: fashionai_test
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fashionai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies (AI 모델 패키지 제외)
        run: pip install fastapi==0.115.8 python-multipart==0.0.20 "sqlalchemy>=2.0,<3" psycopg2-binary python-dotenv httpx opencv-python-headless Pillow numpy "pytest>=8,<10"
      - name: APK release safety tests
        working-directory: tools
        run: python -m unittest -v test_apk_release
      - name: Backend unit tests (격리 SQLite, 운영 DB 접근 없음)
        env:
          DATABASE_URL: ''
          DB_AUTO_CREATE: 'false'
          TEST_POSTGRES_URL: postgresql+psycopg2://fashionai_test:local-test-only@127.0.0.1:5432/fashionai_test
        run: set -o pipefail; python -m pytest -q 2>&1 | tee "$RUNNER_TEMP/backend.log"

      - name: Show backend test errors as annotations (로그인 없이 볼 수 있게)
        if: failure()
        run: |
          grep -nE '^(FAIL|ERROR):|Error|assert|File "' "$RUNNER_TEMP/backend.log" | head -60 > "$RUNNER_TEMP/errors.txt" || true
          tail -25 "$RUNNER_TEMP/backend.log" >> "$RUNNER_TEMP/errors.txt"
          msg=$(sed -e 's/%/%25/g' "$RUNNER_TEMP/errors.txt" | awk '{printf "%s%%0A", $0}')
          echo "::error title=Backend test errors::${msg}"

  # 팀원 PC 와 같은 방법(requirements.txt 전체 설치 → uvicorn)으로 서버가 실제로 켜지는지 확인
  server-start:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: ubuntu-24.04
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: pip install -r requirements.txt (수정사항.md 실행 방법 그대로)
        run: |
          set -o pipefail
          python -m pip install -r requirements.txt 2>&1 | tee "$RUNNER_TEMP/pip.log" | tail -5
      - name: Start server and call it (DB 없이)
        run: |
          set -o pipefail
          python -m uvicorn main:app --host 0.0.0.0 --port 8000 > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/ > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/ && echo
          curl -sf http://127.0.0.1:8000/api/health/database && echo
          curl -sf "http://127.0.0.1:8000/api/products" > /dev/null && echo "products ok"
          curl -sf http://127.0.0.1:8000/docs > /dev/null && echo "docs ok"
      - name: Start server with a Supabase-style DATABASE_URL (접속 안 되는 주소 — 서버는 켜지고 DB 만 미연결이어야 함)
        env:
          DATABASE_URL: postgresql://postgres.fake:pw@127.0.0.1:1/postgres
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8001 > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8001/ > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8001/ && echo
          curl -s http://127.0.0.1:8001/api/health/database > "$RUNNER_TEMP/health.json"
          cat "$RUNNER_TEMP/health.json"; echo
          grep -q '"ready":false' "$RUNNER_TEMP/health.json"
      - name: Independent local model server starts safely without GPU or weights
        env:
          LOCAL_VTON_HEALTH_FILE: ${{ runner.temp }}/local-vton-health.json
        run: |
          python -m uvicorn local_vton_server:app --host 127.0.0.1 --port 8010 --no-proxy-headers --no-access-log > "$RUNNER_TEMP/local-vton.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8010/health > "$RUNNER_TEMP/local-vton-health.json"; then break; fi
            sleep 1
          done
          python -c 'import json,os; d=json.load(open(os.environ["LOCAL_VTON_HEALTH_FILE"])); assert d["service"] == "FashionAI local VTON" and d["ready"] is False'

      - name: Show server / pip errors as annotations
        if: failure()
        run: |
          { tail -40 "$RUNNER_TEMP/server.log" 2>/dev/null; tail -15 "$RUNNER_TEMP/local-vton.log" 2>/dev/null; grep -iE 'error|failed' "$RUNNER_TEMP/pip.log" 2>/dev/null | tail -20; } > "$RUNNER_TEMP/errors.txt" || true
          msg=$(sed -e 's/%/%25/g' "$RUNNER_TEMP/errors.txt" | awk '{printf "%s%%0A", $0}')
          echo "::error title=Server start (${{ matrix.os }})::${msg}"
