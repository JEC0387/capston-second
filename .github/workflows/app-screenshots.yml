name: App screenshots

# 발표 · 제출용 앱 화면 캡처. 에뮬레이터에서 ScreenshotTour 테스트만 실행해 PNG 를 모으고,
# 결과를 screenshots-output 브랜치에 올린다 (main 은 건드리지 않음).
on:
  push:
    branches:
      - 'screenshots/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_USER_HOME: ${{ github.workspace }}/../android-user
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            fashion_app/**/*.gradle.kts
            fashion_app/gradle.properties
            fashion_app/gradle/libs.versions.toml
            fashion_app/gradle/wrapper/gradle-wrapper.properties

      - name: Install Android SDK packages
        run: |
          mkdir -p "$ANDROID_USER_HOME"
          printf 'y\n%.0s' {1..100} | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'

      - name: Build app and test APKs
        working-directory: fashion_app
        run: |
          set -o pipefail
          bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest \
            --init-script gradle/test-runtime.init.gradle.kts --console=plain --max-workers=2 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Show build errors
        if: failure()
        run: |
          grep -E '^e: |error:|FAILED|What went wrong' "$RUNNER_TEMP/build.log" | head -60 > "$RUNNER_TEMP/errors.txt" || true
          msg=$(sed -e 's/%/%25/g' "$RUNNER_TEMP/errors.txt" | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build errors::${msg}"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator and capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          cores: 4
          ram-size: 4096M
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 900
          force-avd-creation: false
          script: bash .github/scripts/take_screenshots.sh

      - name: Report captured files
        if: always()
        run: |
          n=$(ls screenshots/*.png 2>/dev/null | wc -l)
          fails=$(grep -cE 'FAILURES|Error in|Process crashed' screenshots/instrument.log 2>/dev/null || true)
          echo "::notice title=Screenshots::captured=$n files; $(ls screenshots/*.png 2>/dev/null | xargs -n1 basename | tr '\n' ' ')"
          grep -E 'FAILURES|Error in |Process crashed|Exception|at com.jeiu' screenshots/instrument.log 2>/dev/null | head -30 > "$RUNNER_TEMP/fail.txt" || true
          if [ -s "$RUNNER_TEMP/fail.txt" ]; then
            msg=$(sed -e 's/%/%25/g' "$RUNNER_TEMP/fail.txt" | awk '{printf "%s%%0A", $0}')
            echo "::warning title=Instrument output::${msg}"
          fi

      - name: Push screenshots to screenshots-output branch
        if: always()
        run: |
          [ -n "$(ls screenshots/*.png 2>/dev/null)" ] || exit 0
          mkdir -p "$RUNNER_TEMP/out" && cp screenshots/* "$RUNNER_TEMP/out/"
          cd "$RUNNER_TEMP/out"
          git init -q -b screenshots-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "App screenshots from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" screenshots-output

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-screenshots
          path: screenshots/
          if-no-files-found: warn
          retention-days: 30
