name: CI social login (verification only)
on:
  push:
    branches: [ci/social-login-bearer]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fashionai_test
          POSTGRES_USER: fashionai_test
          POSTGRES_PASSWORD: local-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fashionai_test" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: {run: {shell: bash, working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install fastapi==0.115.8 python-multipart==0.0.20 "sqlalchemy>=2.0,<3" psycopg2-binary python-dotenv httpx opencv-python-headless Pillow numpy "pytest>=8,<10"
      - env:
          DATABASE_URL: ''
          DB_AUTO_CREATE: 'false'
          TEST_POSTGRES_URL: postgresql+psycopg2://fashionai_test:local-test-only@127.0.0.1:5432/fashionai_test
        run: |
          python -m pytest -q 2>&1 | tee /tmp/b.log | tail -60; grep -qE " passed" /tmp/b.log && ! grep -qE "[0-9]+ (failed|error)" /tmp/b.log
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_USER_HOME: ${{ github.workspace }}/../android-user
    defaults: {run: {shell: bash, working-directory: fashion_app}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: gradle}
      - run: |
          mkdir -p "$ANDROID_USER_HOME"
          printf 'y\n%.0s' {1..100} | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools' >/dev/null
      - name: Build
        run: |
          bash gradlew :app:assembleDebug --init-script gradle/test-runtime.init.gradle.kts --console=plain --max-workers=2 2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E "^e: |FAIL|BUILD" || true; grep -q "BUILD SUCCESSFUL" "$RUNNER_TEMP/build.log"
      - name: Unit tests
        run: |
          bash gradlew :app:testDebugUnitTest --init-script gradle/test-runtime.init.gradle.kts --console=plain --max-workers=2 2>&1 | tee "$RUNNER_TEMP/test.log" | grep -E "^e: |FAILED|tests completed|BUILD" || true; grep -q "BUILD SUCCESSFUL" "$RUNNER_TEMP/test.log"
      - if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for fl in list(tc.findall('failure')) + list(tc.findall('error')):
                      msg = (fl.get('message') or '') + ' | ' + (fl.text or '')[:900]
                      print('::error::' + tc.get('classname') + '.' + tc.get('name') + ' :: ' + msg.replace('\n', ' / ')[:1500])
          PY
          grep -E "^e: " "$RUNNER_TEMP/test.log" | head -20 | sed 's/^/::error::/' || true
